<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problemas Sistêmicos</title>
<meta name="theme-color" content="#642A90">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* paleta da empresa (a mesma do Painel - Nível de Serviço) */
  --roxo:#642A90; --verdeB:#99CC33; --laranja:#FF9901; --rosa:#EC357D; --azulB:#0164C9;
  --p50:#f6f1fa; --p100:#ebe0f4; --p200:#d5bfe7; --p300:#b48fd3; --p500:#8549b5; --p700:#642A90; --p800:#52227a; --p900:#3a1658;
  --brand:var(--p700); --accent:var(--p700);
  --bg:#f5f3f8; --card:#fff; --ink:#1f1530; --ink2:#5b5068; --ink3:#9a90a8; --line:#e6e0ee;
  /* verde = sem ocorrência; rosa/laranja = falha */
  --ok:#5f8a12; --okbg:#eef7dc; --warn:#b36800; --warnbg:#fff1dc; --bad:#c41a60; --badbg:#fde6ef;
  /* tipo de falha: do mais grave (vermelho) ao mais leve (amarelo), variando rosa e laranja da empresa */
  --fTotal:#D61F4F; --fParcial:#F2603E; --fInterm:#FF9901; --fLent:#FFC629; --fOutro:#B3A6C2;
  --tot:#B4245E;                 /* total de todos os sistemas (rosa escuro) */
  --neu:#ece6f2; --neuInk:#5b5068;  /* chamado encerrado: neutro */
  --grid:#f6f3f9; --gridOn:#efe6f0; --sdA:#efebf3; --sdB:#e2dbe9;
  --selbg:#FFF4E3; --selln:#FFD9A0; --selink:#B86A00; --domc:#C41A60;
  --r:14px; --sh:0 1px 2px rgba(58,22,88,.06),0 6px 18px rgba(58,22,88,.06);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#140c1d; --card:#1f1530; --ink:#efe9f6; --ink2:#bdb1cc; --ink3:#7d7190; --line:#352849;
    --brand:var(--p800); --accent:#b48fd3;
    --ok:#b6e05a; --okbg:#253312; --warn:#ffb347; --warnbg:#3a2608; --bad:#ff6fa5; --badbg:#3f1226;
    --fTotal:#F2456F; --fParcial:#FF7656; --fInterm:#FFAA2E; --fLent:#FFD452; --fOutro:#7d7190; --tot:#F06A9E;
    --neu:#2c2140; --neuInk:#bdb1cc;
    --grid:#251b33; --gridOn:#33223a; --sdA:#1a1226; --sdB:#2b2039;
    --selbg:rgba(255,153,1,.13); --selln:rgba(255,153,1,.45); --selink:#FFB547; --domc:#ff6fa5; --sh:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* overflow-x:clip (e não hidden): hidden transforma o body em área de rolagem e a barra do topo deixa de ficar presa */
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* topo */
header.top{position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(31,12,48,.18);background:linear-gradient(135deg,var(--p800),var(--p700) 60%,var(--p500));color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px}
.top .row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.92;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none;opacity:.9}
.dot.live{background:#fff;animation:pulse 2s infinite}
.dot.off{background:var(--laranja);animation:none}
.dot.err{background:var(--rosa);box-shadow:0 0 0 2px #fff;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.dot.live{animation:none}}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{background:rgba(255,255,255,.26)}
.ib svg{width:20px;height:20px}
.ib.on{background:#fff;color:var(--p700)}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:760px;margin:0 auto;padding:12px 12px calc(86px + var(--safe-b))}
.page[hidden]{display:none}
#pgPainel,#pgPainel *{touch-action:pan-y pinch-zoom}
#pag{will-change:transform}

/* menu de baixo */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;border:0;background:none;color:var(--ink3);padding:9px 4px 11px;font-weight:650;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .bd{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--fTotal);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
nav.tabs .bd[hidden]{display:none}

.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}

/* seções */
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin:20px 4px 8px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
h2.sec .ct{background:var(--p100);color:var(--p700);border-radius:999px;padding:1px 8px;font-size:12px;letter-spacing:0}
h2.sec .ct.hot{background:var(--fTotal);color:#fff}
@media (prefers-color-scheme: dark){h2.sec .ct{background:#3a2356;color:#d5bfe7}h2.sec .ct.hot{background:var(--fTotal);color:#fff}}
h2.sec .sp{flex:1}
h2.sec .lb{white-space:nowrap}
h2.sec .rt{white-space:nowrap;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink3)}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 2px;text-transform:none;letter-spacing:0}

/* ocorrências ativas (cards grandes) */
.open{display:grid;gap:10px}
/* card de ocorrência ativa: fundo branco tingido pela cor do tipo de falha, texto no tom escuro da mesma cor */
.oc{--tb:var(--card);--ti:var(--ink);background:var(--tb);color:var(--ti);border-radius:var(--r);box-shadow:var(--sh);border:1px solid color-mix(in srgb,var(--ti) 14%,transparent);padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:block}
.oc:active{transform:scale(.995)}
.oc.k-total{--tb:#FEEFF2;--ti:#5C0B22}
.oc.k-parcial{--tb:#FFF2EC;--ti:#5E1E0A}
.oc.k-interm{--tb:#FFF5E6;--ti:#523000}
.oc.k-lent{--tb:#FFF9E3;--ti:#463400}
.oc.k-outro{--tb:#F8F5FB;--ti:#3A1658}
@media (prefers-color-scheme: dark){
  .oc.k-total{--tb:#36121E;--ti:#FFC9D6}
  .oc.k-parcial{--tb:#361911;--ti:#FFCDBD}
  .oc.k-interm{--tb:#32220A;--ti:#FFDCA6}
  .oc.k-lent{--tb:#2F270B;--ti:#FFE9A6}
  .oc.k-outro{--tb:#2a1c3d;--ti:#E6D8F5}
}
.oc .h{display:flex;align-items:center;gap:8px}
.oc .sis{font-weight:800;font-size:18px;letter-spacing:-.2px;flex:1;min-width:0;overflow-wrap:anywhere}
.oc .imp{margin-top:6px;font-size:14.5px}
.oc .tl{margin-top:8px}
.oc .meta{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.oc .meta b{font-weight:700;opacity:.7}
/* ID da solicitação: cápsula só com borda */
.cap-id{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1.5px solid currentColor;background:transparent}
/* barra do dia: expediente 08h–20h de hoje, preenchida na cor do tipo de falha */
.oc .dbar{margin-top:12px}
.oc .dbar .trk{position:relative;height:12px;border-radius:999px;background:color-mix(in srgb,var(--ti) 9%,transparent);overflow:hidden}
.oc .dbar .trk::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:color-mix(in srgb,var(--ti) 22%,transparent)}
.oc .dbar .fill{position:absolute;top:0;bottom:0;border-radius:999px;min-width:0}
.oc.k-total .fill{background:#D61F4F}.oc.k-parcial .fill{background:#F2603E}.oc.k-interm .fill{background:#FF9901}.oc.k-lent .fill{background:#FFC629}.oc.k-outro .fill{background:#7d7190}
.oc .dbar .esc{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:4px;opacity:.72}
.oc .dbar .dtx{text-align:center;font-weight:600}
.oc .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}
.oc .timer{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
.oc .timer small{display:block;font-size:11.5px;font-weight:600;letter-spacing:0;margin-bottom:4px;opacity:.75}
.oc .when{text-align:right;font-size:12.5px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.oc .when .ini{opacity:.78}
.oc .evo{font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 9px;background:color-mix(in srgb,var(--ti) 10%,transparent);white-space:nowrap}
/* cápsula do tipo de falha: cor cheia; texto branco onde a cor é forte, escuro onde é clara (laranja e amarelo) */
.cap-t{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--fc,var(--fOutro));color:#fff}
.cap-t.k-interm,.cap-t.k-lent{color:#2b1a00}
/* a cápsula usa a cor normal do tipo nos dois temas (no escuro as variáveis clareiam e o branco perderia leitura) */
.cap-t.k-total{background:#D61F4F}.cap-t.k-parcial{background:#F2603E}.cap-t.k-interm{background:#FF9901}.cap-t.k-lent{background:#FFC629}.cap-t.k-outro{background:#7d7190}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-crit{background:var(--p100);color:var(--p700)}
.t-crit.alta{background:var(--badbg);color:var(--bad)}
.t-crit.media{background:var(--warnbg);color:var(--warn)}
@media (prefers-color-scheme: dark){.t-crit{background:#3a2356;color:#d5bfe7}}
.t-novo{background:var(--fTotal);color:#fff}
.t-mudou{background:var(--laranja);color:#2b1a00}
.tf{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tf i{width:9px;height:9px;border-radius:3px;background:var(--fc,var(--fOutro));display:inline-block}
.calm-card{background:var(--okbg);color:var(--ok);border-radius:var(--r);padding:18px 16px;display:flex;gap:14px;align-items:center;border:1px solid color-mix(in srgb,var(--ok) 25%,transparent)}
.calm-card svg{width:36px;height:36px;flex:none}
.calm-card b{display:block;font-size:17px}
.calm-card span{font-size:13px;opacity:.9}

/* listas (hoje / histórico) */
.day,.lst{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 6px;font-size:13px;gap:8px}
.day .dh b{font-size:14px}
.day .dh span{color:var(--ink2);white-space:nowrap}
.hi{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.lst .hi:first-child{border-top:0}
.hi .bar{align-self:stretch;border-radius:4px;background:var(--fc,var(--fOutro))}
.hi.ind .bar{background:repeating-linear-gradient(45deg,var(--ink3) 0 3px,transparent 3px 6px)}
.hi .s{font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .d{font-size:12.5px;color:var(--ink2);margin-top:1px}
.hi.ind .s{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.hi .du{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.hi .du small{display:block;font-weight:600;font-size:11.5px;color:var(--ink3)}
.hi.aberto{background:color-mix(in srgb,var(--badbg) 55%,transparent)}
.hi.aberto .du,.hi.aberto .du small{color:var(--bad)}
.empty{padding:14px;color:var(--ink2);font-size:13.5px}
.empty.okt{color:var(--ok);background:var(--okbg)}
.more{display:block;width:100%;border:1px dashed var(--p300);background:none;color:var(--accent);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;margin-top:4px}

/* mudanças */
.feed{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.fi{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.fi:first-child{border-top:0}
.fi .hr{font-weight:700;font-size:13px;color:var(--ink2)}
.fi .hr small{display:block;font-weight:500;font-size:11px;color:var(--ink3)}
.fi .tx{font-size:14px;min-width:0}
.fi .tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12.5px}
.st{border-radius:6px;padding:1px 6px;font-weight:700;font-size:11.5px;background:var(--neu);color:var(--neuInk)}
.st.a{background:var(--fTotal);color:#fff}
.st.e{background:var(--warnbg);color:var(--warn)}

/* histórico: filtros */
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.search,.selsis{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.search:focus,.selsis:focus{outline:2px solid var(--p300);outline-offset:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--fc);display:inline-block}
.chip[aria-pressed="true"]{background:var(--p700);border-color:var(--p700);color:#fff}
.hres{font-size:12.5px;color:var(--ink2);margin:2px 4px 8px;display:flex;justify-content:space-between;gap:8px}

/* painel (mesma estrutura do app de NS) */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--p700);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
@media (prefers-color-scheme: dark){.card h2{color:#c9a6ec}}
.topbar{display:flex;flex-direction:column;align-items:stretch}
.topbar .meta-line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.seg{display:flex;width:100%;background:var(--p50);border:1px solid var(--p200);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--p700);cursor:pointer}
.seg button.on{background:var(--p700);color:#fff;box-shadow:0 2px 6px rgba(100,42,144,.35)}
@media (prefers-color-scheme: dark){.seg{background:#2a1c3d;border-color:#4a3466}.seg button{color:#d3b5f0}.seg button.on{background:#8549b5}}
.selchip{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--selln);background:var(--selbg);color:var(--selink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer}
.selchip .t{text-align:left}
.kpis2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh);min-width:0}
.kpi .l{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.kper .v{font-size:17px;margin-top:5px;margin-bottom:3px}
.kpi.ksel{border-color:var(--selln);background:linear-gradient(0deg,var(--selbg),var(--selbg)),var(--card)}
.okv{color:var(--ok)} .okt{color:var(--ok);font-weight:600}
b.dias,.parc{color:var(--p700);font-weight:700}
@media (prefers-color-scheme: dark){b.dias,.parc{color:#d3b5f0}}
.dlt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.dlt.up{color:#5F8A12} .dlt.down{color:#D0256A} .dlt.neu{color:var(--ink2)}
@media (prefers-color-scheme: dark){.dlt.up{color:#B6E05A}.dlt.down{color:#FF6FA5}}
.wdf{display:flex;gap:5px;align-items:center;margin:12px 0}
.wdf button{flex:1 1 0;min-width:0;height:32px;padding:0;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:11.5px;font-weight:700;cursor:pointer}
.wdf button.dom{color:var(--domc)}
.wdf button.on{background:var(--p700);border-color:var(--p700);color:#fff}
.wdf .wdx{flex:0 0 32px;width:32px;background:var(--selbg);border-color:var(--selln);color:var(--selink);font-size:13px}
@media (prefers-color-scheme: dark){.wdf button.on{background:#8549b5;border-color:#8549b5}}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart svg .hit{cursor:pointer}
.cap{font-size:12.5px;color:var(--ink2);min-height:18px;margin-top:6px;font-variant-numeric:tabular-nums}
.cap.capsel{color:var(--selink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px}
.legend i.hach{background:repeating-linear-gradient(45deg,var(--tot) 0 3px,color-mix(in srgb,var(--tot) 50%,transparent) 3px 6px)}
.legend i.sd{background:repeating-linear-gradient(135deg,var(--sdA) 0 2px,var(--sdB) 2px 4px);outline:1px solid var(--line)}
.legend i.fora{width:5px;height:12px;border:1.5px dashed var(--ink2);border-radius:2px;background:none}
.legend i.indev{background:repeating-linear-gradient(45deg,var(--ink3) 0 2px,transparent 2px 5px)}
table.conf{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;letter-spacing:-.2px}
table.conf th{font:600 10.5px system-ui;color:var(--ink2);text-align:right;padding:0 4px}
table.conf th:first-child{text-align:left}
table.conf td{padding:8px 4px;text-align:right;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.conf td:first-child{padding-left:7px;text-align:left;border-left:1px solid var(--line);border-radius:9px 0 0 9px;font-weight:650}
table.conf td:last-child{padding-right:7px;border-right:1px solid var(--line);border-radius:0 9px 9px 0}
table.conf td.nd{color:var(--ink3)}
table.tsel tbody tr{cursor:pointer}
table.tsel tbody tr.sel td{background:var(--selbg);border-top-color:var(--selln);border-bottom-color:var(--selln)}
table.tsel tbody tr.sel td:first-child{border-left-color:var(--selln);box-shadow:inset 3px 0 0 #FF9901;color:var(--selink)}
table.tsel tbody tr.sel td:last-child{border-right-color:var(--selln)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.okp{background:var(--okbg);color:var(--ok)}
.small{font-size:12.5px} .muted{color:var(--ink2)}
@media (max-width:375px){table.conf{font-size:12px;letter-spacing:-.3px}table.conf td{padding:8px 3px}table.conf th{padding:0 3px;font-size:10px}}
/* matriz sistemas × períodos */
.mxcard .mxhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;margin:0 0 4px;cursor:pointer;text-align:left;color:inherit}
.mxcard .mxhead h2{flex:1;margin:0}
.mxcard .mxhead .seta{flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--p700)}
.mxcard .mxhead .seta svg{width:22px;height:22px}
@media (prefers-color-scheme: dark){.mxcard .mxhead .seta{color:#d3b5f0}}
.mxcard .mxsub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.mx{display:grid;grid-template-columns:var(--lab) repeat(var(--n),minmax(0,1fr)) 40px;column-gap:3px;row-gap:4px;align-items:stretch;margin-top:6px}
.mx .hd{font-size:11px;font-weight:700;color:var(--ink2);text-align:center;padding:2px 0 4px;line-height:1.15;cursor:pointer;border-radius:6px;border:0;background:none;min-width:0}
.mx .hd small{display:block;font-size:9px;font-weight:500;color:var(--ink3)}
.mx .hd.dom,.mx .hd.dom small{color:var(--domc)}
.mx .hd.and{color:var(--p700)}
.mx .hd.sd{color:var(--ink3)}
.mx .hd.sel,.mx .hd.sel small{background:var(--selbg);color:var(--selink)}
.mx .corner{font-size:10px;color:var(--ink3);align-self:end;padding-bottom:4px}
.mx .tot{font-size:10.5px;font-weight:700;color:var(--ink2);text-align:right;align-self:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx .tot.hd2{font-size:9.5px;color:var(--ink3);align-self:end;padding-bottom:4px;font-weight:600}
.mx .tot.tt{color:var(--tot)}
.mx .sys{font-size:11px;line-height:1.15;font-weight:600;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;align-self:center;padding-right:2px}
.mx .sys.sel{color:var(--selink)}
.mx .sys.totl{font-weight:800;color:var(--tot)}
@media (prefers-color-scheme: dark){.mx .hd.and{color:#d3b5f0}}
.mx .sep{grid-column:1 / -1;height:1px;background:var(--line);margin:2px 0}
.mx .cel{position:relative;height:28px;border-radius:6px;background:var(--grid);overflow:hidden;cursor:default;border:0;padding:0;display:block;width:100%;min-width:0}
.mx .cel.tem{cursor:pointer;background:var(--gridOn)}
.mx .cel.sd{background:repeating-linear-gradient(135deg,var(--sdA) 0 4px,var(--sdB) 4px 8px)}
.mx .cel.colsel{background:var(--selbg)}
.mx .cel.sd.colsel{background:repeating-linear-gradient(135deg,var(--selbg) 0 4px,var(--selln) 4px 8px)}
.mx .cel.sel{outline:2px solid #FF9901;outline-offset:-1px;background:var(--selbg)}
.mx .cel .dv{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.mx .cel .bar{position:absolute;top:6px;height:16px;border-radius:3px;min-width:3px}
.mx .cel .bar.tot{background:var(--tot)}
.mx .cel .bar.viva{box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--fTotal)}
.mx .cel .bar.indev{background:repeating-linear-gradient(45deg,var(--ink3) 0 2px,transparent 2px 5px)!important;opacity:.8}
.mx .cel .fora{position:absolute;top:4px;bottom:4px;width:4px;border:1.5px dashed var(--ink2);border-radius:2px}
.mxcard .legend{margin-top:10px}
.mxcard .vazio{font-size:13.5px;color:var(--ok);padding:14px 4px;text-align:center}
@media (max-width:380px){.mx{column-gap:2px}.mx .sys{font-size:10.5px}.mx .cel{height:26px}.mx .cel .bar{top:5px}}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;padding-bottom:12px;margin:0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;word-break:break-word}
.banner details summary{cursor:pointer}
.avisos{margin-top:20px}
.avisos:empty{display:none}
.warnlist{font-size:12.5px;margin:6px 0 0;padding-left:18px}

/* folha (lista e detalhe) */
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,29,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto;overscroll-behavior:contain}
.sheet:not(.show){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 2px;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:44px}
.sheet .sub{color:var(--ink2);font-size:13.5px;margin-bottom:12px}
.sheet .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.sheet .volta{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:650;font-size:13px;cursor:pointer;margin-bottom:8px;color:var(--ink2)}
.sheet .big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sheet .big div{background:var(--bg);border-radius:12px;padding:10px 12px}
.sheet .big small{display:block;color:var(--ink2);font-size:12px}
.sheet .big b{font-size:17px}
.sheet h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin:16px 0 6px}
.sheet .lst{box-shadow:none}

.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translate(-50%,0);opacity:0;pointer-events:none;background:var(--p900);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 28px rgba(0,0,0,.25);transition:opacity .2s ease;cursor:pointer}
.toast.show{opacity:1;pointer-events:auto}
.foot{color:var(--ink3);font-size:12px;text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div style="flex:1;min-width:0">
      <h1 id="titulo">Problemas Sistêmicos</h1>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTx">Carregando…</span></div>
    </div>
    <button class="ib" id="btBell" aria-label="Avisos no aparelho" title="Avisar no aparelho quando um chamado mudar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
    <button class="ib" id="btRefresh" aria-label="Atualizar agora" title="Atualizar agora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="banners"></div>

  <!-- 1) Ocorrências -->
  <section class="page" id="pgOc">
    <h2 class="sec">Ocorrências ativas <span class="ct num" id="ctOpen">0</span></h2>
    <div class="open" id="open"></div>
    <h2 class="sec"><span class="lb">Chamados de hoje</span> <span class="sp"></span><span class="rt num" id="hojeRes"></span></h2>
    <div id="hoje"></div>
    <h2 class="sec">Últimas mudanças <span class="sp"></span><button class="lnk" id="btFeed" hidden>Ver todas</button></h2>
    <div class="feed" id="feed"></div>
  </section>

  <!-- 2) Histórico -->
  <section class="page" id="pgHist" hidden>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Buscar sistema, chamado, impacto…" autocomplete="off" enterkeyhint="search" aria-label="Buscar no histórico">
      <select class="selsis" id="fSis" aria-label="Filtrar por sistema"></select>
      <div class="chips" id="chips" role="group" aria-label="Filtro por tipo de falha"></div>
    </div>
    <div class="hres num" id="hres"></div>
    <div id="hist"></div>
  </section>

  <!-- 3) Painel -->
  <section class="page" id="pgPainel" hidden></section>

  <div id="avisos" class="avisos"></div>
  <p class="foot">Problemas Sistêmicos · v<span id="ver"></span></p>
</main>

<nav class="tabs" id="tabs">
  <button data-v="oc" class="on"><span class="bd num" id="navBd" hidden></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Ocorrências</button>
  <button data-v="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
  <button data-v="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Painel</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="painel.js"></script>
<script src="app.js"></script>
</body>
</html>
