<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problemas Sistêmicos</title>
<meta name="theme-color" content="#642A90">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* paleta da empresa (a mesma do Painel - Nível de Serviço) */
  --roxo:#642A90; --verdeB:#99CC33; --laranja:#FF9901; --rosa:#EC357D; --azulB:#0164C9;
  --p50:#f6f1fa; --p100:#ebe0f4; --p200:#d5bfe7; --p300:#b48fd3; --p500:#8549b5; --p700:#642A90; --p800:#52227a; --p900:#3a1658;
  --brand:var(--p700); --brand-ink:#fff; --accent:var(--p700);
  --bg:#f5f3f8; --card:#fff; --ink:#1f1530; --ink2:#5b5068; --ink3:#9a90a8; --line:#e6e0ee;
  --ok:#5f8a12; --okbg:#eef7dc; --warn:#b36800; --warnbg:#fff1dc; --bad:#c41a60; --badbg:#fde6ef; --info:#0164C9; --infobg:#e2eefb;
  /* tipo de falha (mesmas cores do card de sistemas do painel de NS) */
  --fTotal:#EC357D; --fParcial:#FF9901; --fInterm:#0164C9; --fLent:#99CC33; --fOutro:#9a90a8;
  --r:14px; --sh:0 1px 2px rgba(58,22,88,.06),0 6px 18px rgba(58,22,88,.06);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#140c1d; --card:#1f1530; --ink:#efe9f6; --ink2:#bdb1cc; --ink3:#7d7190; --line:#352849;
    --brand:var(--p800); --accent:#b48fd3;
    --ok:#b6e05a; --okbg:#253312; --warn:#ffb347; --warnbg:#3a2608; --bad:#ff6fa5; --badbg:#3f1226; --info:#5fa8ff; --infobg:#0d2747;
    --fInterm:#3d8fe6; --sh:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(24px + var(--safe-b))}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* topo */
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(10px + var(--safe-t)) 16px 10px}
.top .row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0}
.top .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.92;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--verdeB);flex:none;box-shadow:0 0 0 3px rgba(153,204,51,.25)}
.dot.live{animation:pulse 2s infinite}
.dot.off{background:var(--laranja);box-shadow:0 0 0 3px rgba(255,153,1,.25);animation:none}
.dot.err{background:var(--rosa);box-shadow:0 0 0 3px rgba(236,53,125,.3);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.dot.live{animation:none}}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{background:rgba(255,255,255,.26)}
.ib svg{width:20px;height:20px}
.ib.on{background:#fff;color:var(--p700)}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:760px;margin:0 auto;padding:12px 16px 0}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.banner b{font-weight:700}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px;border:1px solid var(--line);min-width:0}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink2);line-height:1.2;margin-top:2px}
.kpi.hot .v{color:var(--bad)}
.kpi.calm .v{color:var(--ok)}

/* seções */
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
h2.sec .ct{background:var(--p100);color:var(--p700);border-radius:999px;padding:1px 8px;font-size:12px;letter-spacing:0}
@media (prefers-color-scheme: dark){h2.sec .ct{background:#3a2356;color:#d5bfe7}}
h2.sec .sp{flex:1}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 2px;text-transform:none;letter-spacing:0}

/* cards de chamado em andamento */
.open{display:grid;gap:10px}
.oc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);border-left:6px solid var(--fc,var(--fOutro));padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block}
.oc:active{transform:scale(.995)}
.oc .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc .sis{font-weight:800;font-size:17px;letter-spacing:-.2px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-crit{background:var(--p100);color:var(--p700)}
.t-crit.alta{background:var(--badbg);color:var(--bad)}
.t-crit.media{background:var(--warnbg);color:var(--warn)}
@media (prefers-color-scheme: dark){.t-crit{background:#3a2356;color:#d5bfe7}}
.t-novo{background:var(--rosa);color:#fff}
.t-mudou{background:var(--laranja);color:#2b1a00}
.t-ind{background:var(--line);color:var(--ink2)}
.oc .evo{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:700;font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:4px 8px}
.oc .imp{margin-top:8px;color:var(--ink);font-size:14.5px}
.oc .meta{margin-top:6px;color:var(--ink2);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.oc .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.oc .timer{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--bad);line-height:1}
.oc .timer small{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-bottom:3px}
.oc .when{text-align:right;font-size:12.5px;color:var(--ink2)}
.tf{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tf i{width:9px;height:9px;border-radius:3px;background:var(--fc,var(--fOutro));display:inline-block}

.calm-card{background:var(--okbg);color:var(--ok);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center}
.calm-card svg{width:30px;height:30px;flex:none}
.calm-card b{display:block;font-size:16px}
.calm-card span{font-size:13px;opacity:.9}

/* mudanças */
.feed{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.fi{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.fi:first-child{border-top:0}
.fi .hr{font-weight:700;font-size:13px;color:var(--ink2)}
.fi .hr small{display:block;font-weight:500;font-size:11px;color:var(--ink3)}
.fi .tx{font-size:14px;min-width:0}
.fi .tx b{font-weight:700}
.fi .tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12.5px}
.st{border-radius:6px;padding:1px 6px;font-weight:700;font-size:11.5px;background:var(--line);color:var(--ink2)}
.st.a{background:var(--badbg);color:var(--bad)}
.st.f{background:var(--okbg);color:var(--ok)}
.st.e{background:var(--warnbg);color:var(--warn)}
.empty{padding:14px;color:var(--ink2);font-size:13.5px}

/* histórico */
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.search:focus{outline:2px solid var(--p300);outline-offset:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--fc);display:inline-block}
.chip[aria-pressed="true"]{background:var(--p700);border-color:var(--p700);color:#fff}
.day{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:10px;overflow:hidden}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 6px;font-size:13px}
.day .dh b{font-size:14px}
.day .dh span{color:var(--ink2)}
.hi{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.hi .bar{align-self:stretch;border-radius:4px;background:var(--fc,var(--fOutro))}
.hi.ind .bar{background:repeating-linear-gradient(45deg,var(--fc,var(--fOutro)) 0 3px,transparent 3px 6px)}
.hi .s{font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .d{font-size:12.5px;color:var(--ink2);margin-top:1px}
.hi.ind .s{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.hi .du{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.hi .du small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3)}
.hi.aberto .du{color:var(--bad)}
.more{display:block;width:100%;border:1px dashed var(--p300);background:none;color:var(--accent);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;margin-top:4px}

/* dados */
details.dados{background:var(--card);border-radius:var(--r);border:1px solid var(--line);margin-top:20px;padding:0 14px}
details.dados summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--ink2);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;padding-bottom:12px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;word-break:break-word}
.warnlist{font-size:13px;color:var(--warn);margin:0 0 12px;padding-left:18px}

/* detalhe */
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,29,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 2px;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .sub{color:var(--ink2);font-size:13.5px;margin-bottom:12px}
.sheet .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.sheet .big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sheet .big div{background:var(--bg);border-radius:12px;padding:10px 12px}
.sheet .big small{display:block;color:var(--ink2);font-size:12px}
.sheet .big b{font-size:17px}
.sheet h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin:16px 0 6px}
.sheet .kv{padding-bottom:0}

.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translate(-50%,140%);background:var(--p900);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 28px rgba(0,0,0,.25);transition:transform .25s ease;cursor:pointer}
.toast.show{transform:translate(-50%,0)}
.foot{color:var(--ink3);font-size:12px;text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div style="flex:1;min-width:0">
      <h1>Problemas Sistêmicos</h1>
      <div class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTx">Carregando…</span></div>
    </div>
    <button class="ib" id="btBell" aria-label="Avisos no aparelho" title="Avisar no aparelho quando um chamado mudar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
    <button class="ib" id="btRefresh" aria-label="Atualizar agora" title="Atualizar agora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="banners"></div>

  <section class="kpis" id="kpis" aria-label="Resumo"></section>

  <h2 class="sec">Em andamento <span class="ct num" id="ctOpen">0</span></h2>
  <div class="open" id="open"></div>

  <h2 class="sec">Últimas mudanças <span class="sp"></span><button class="lnk" id="btFeed" hidden>Ver todas</button></h2>
  <div class="feed" id="feed"></div>

  <h2 class="sec">Histórico</h2>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Buscar sistema, chamado, impacto…" autocomplete="off" enterkeyhint="search">
    <div class="chips" id="chips" role="group" aria-label="Filtro por tipo de falha"></div>
  </div>
  <div id="hist"></div>

  <details class="dados" id="dados">
    <summary>Sobre os dados</summary>
    <div id="dadosBody"></div>
  </details>
  <p class="foot">Problemas Sistêmicos · v<span id="ver"></span></p>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
